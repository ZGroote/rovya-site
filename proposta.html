<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="img/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proposta | ROVYA Creative</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0e0809">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('rovya-tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* mesma paleta e fontes do site e do portal */
:root{
  --bg:#0e0809;--bg2:#160c0e;--wine:#5a0f1e;--gold:#c9a063;--gold2:#e6c891;--ink:#f3ebe3;--mute:#a8978c;--line:rgba(201,160,99,.22);
  --serif:"Cormorant Garamond",Georgia,serif;--sans:Inter,system-ui,sans-serif;
  --glow:rgba(90,15,30,.55);--glow2:rgba(201,160,99,.08);
  --painel:rgba(29,17,19,.62);--campo:rgba(201,160,99,.35);--bad:#e8907f;--ok:#9fc59a;
  --sombra:0 40px 90px rgba(0,0,0,.55);color-scheme:dark}
[data-theme=light]{
  --bg:#e7e0d6;--bg2:#ddd4c8;--ink:#2a2421;--mute:#5f5650;--gold:#7a3d22;--gold2:#8f4a2a;--wine:#5c1a24;--line:rgba(42,36,33,.16);
  --glow:rgba(255,255,255,.4);--glow2:rgba(122,61,34,.06);
  --painel:rgba(239,233,225,.72);--campo:rgba(42,36,33,.28);--bad:#a3261e;--ok:#3d6b37;--sombra:0 30px 70px rgba(60,40,30,.16);color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.6;min-height:100svh;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{width:min(860px,100% - 32px);margin-inline:auto}
.eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
em{color:var(--gold);font-style:italic}
.glow{position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(60vmax 45vmax at 85% 10%,var(--glow),transparent 70%),radial-gradient(40vmax 30vmax at 10% 90%,var(--glow2),transparent 70%)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.logo{font-family:var(--serif);font-size:1.6rem;letter-spacing:.28em;text-decoration:none}
.logo small{display:block;font-family:var(--sans);font-size:.52rem;letter-spacing:.55em;color:var(--gold);margin-top:-4px;text-align:center}
.nav-dir{display:flex;align-items:center;gap:1rem}
.link{background:none;border:0;cursor:pointer;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.link:hover{opacity:1}
.tema{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}
.tema svg{width:18px;height:18px}
.tema .sol,[data-theme=light] .tema .lua{display:none}
[data-theme=light] .tema .sol{display:block}
.painel{position:relative;background:var(--painel);border:1px solid var(--line);border-radius:20px;padding:clamp(1.3rem,4vw,2.6rem);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sombra);margin-bottom:1.4rem}
.painel::before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1;margin:.8rem 0 .8rem}
h2{font:400 clamp(1.5rem,3vw,1.9rem)/1.1 var(--serif);margin-bottom:1rem}
.mute{color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400;text-align:left;padding:.4rem 0;border-bottom:1px solid var(--line)}
td{padding:.8rem 0;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--mute);white-space:pre-wrap;font-size:.82rem}
.dir{text-align:right;padding-left:1rem;white-space:nowrap}
tfoot td{border:0;padding:.4rem 0}
.total{font:500 1.5rem var(--serif);color:var(--gold)}
.txt{white-space:pre-wrap;font-size:.98rem}
.txt b.tit{display:block;font:500 1.3rem/1.3 var(--serif);margin-top:.8rem}
hr{border:0;border-top:1px solid var(--line);margin:.8rem 0}
form{display:grid;gap:1.1rem}
.campo{display:block;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.campo input{display:block;width:100%;margin-top:.45rem;padding:.65rem 0;background:transparent;border:0;border-bottom:1px solid var(--campo);color:var(--ink);font:400 1rem var(--sans);outline:none}
.campo input:focus{border-bottom-color:var(--gold)}
.marca{display:flex;gap:.7rem;align-items:flex-start;font-size:.92rem;cursor:pointer}
.marca input{margin-top:.3rem;accent-color:var(--gold);width:18px;height:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.95rem 1.5rem;border:0;border-radius:999px;cursor:pointer;text-decoration:none;
  font:500 .72rem var(--sans);letter-spacing:.2em;text-transform:uppercase}
.btn-gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a0c0e}
[data-theme=light] .btn-gold{background:var(--wine);color:#f3ece3}
.btn:disabled{opacity:.6;cursor:progress}
.btn:focus-visible,.tema:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:.88rem;color:var(--bad)}
.msg:empty{display:none}
.aceita{border-left:2px solid var(--ok);padding-left:1rem;color:var(--ok)}
.ajuda{font-size:.82rem;color:var(--mute)}
.vazio{color:var(--mute);text-align:center;padding:3rem 1rem}
@media print{nav,.glow,#aceite form,.ajuda,.nav-dir{display:none!important}body{background:#fff;color:#000}.painel{box-shadow:none;backdrop-filter:none;border-color:#ccc}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<nav><div class="wrap">
  <a href="./" class="logo" aria-label="ROVYA Creative, ir ao site">ROVYA<small>CREATIVE</small></a>
  <div class="nav-dir">
    <button class="link" id="pdf" type="button" hidden>Salvar em PDF</button>
    <button class="tema" id="tema" type="button" aria-label="Trocar entre tema claro e escuro">
      <svg class="lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</div></nav>
<main class="wrap" id="main"><p class="vazio">Abrindo a proposta…</p></main>

<script>
const API = 'https://jgigosrsyxjqqhckudfe.supabase.co/functions/v1/crm-proposta';
const token = location.hash.slice(1);
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = t => esc(t).replace(/^#{1,6}\s*(.+)$/gm, '<b class="tit">$1</b>').replace(/^-{3,}\s*$/gm, '<hr>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const data = d => d ? new Date(d.length === 10 ? d + 'T12:00' : d).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const quando = ts => { const d = new Date(ts); return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
const chamar = async corpo => {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, ...corpo }) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.erro || 'Não consegui abrir agora. Tente de novo em instantes.'); return j;
};
const aviso = t => `<section class="painel"><p class="vazio" style="padding:1.4rem 0">${t}</p><p class="ajuda" style="text-align:center">Dúvidas? Fale com a Rovya pelo <a href="links">WhatsApp ou e-mail</a>.</p></section>`;

function situacao(p) {
  if (p.aceite_em) return `<p class="aceita">✓ Proposta aceita por <b>${esc(p.aceite_nome)}</b> em ${quando(p.aceite_em)}. Obrigada! A Rovya vai falar com você sobre os próximos passos.</p>`;
  if (p.status === 'aprovada') return '<p class="aceita">✓ Proposta aprovada.</p>';
  if (p.atualizada) return '<p class="msg">Esta versão foi atualizada. Peça o link da versão nova à Rovya.</p>';
  if (p.status === 'recusada') return '<p class="mute">Esta proposta foi encerrada. Se quiser retomar, fale com a Rovya.</p>';
  if (p.vencida) return '<p class="msg">O prazo desta proposta venceu. Fale com a Rovya para renovar.</p>';
  if (p.status !== 'enviada') return '<p class="mute">Esta proposta ainda não está aberta para aceite.</p>';
  return `<form id="fAceite">
    <label class="campo">Seu nome completo<input name="nome" autocomplete="name" minlength="3" maxlength="120" required></label>
    <label class="marca"><input type="checkbox" required> <span>Li a proposta e aceito o escopo, os valores e as condições acima.</span></label>
    <p class="msg" id="mAceite" role="alert"></p>
    <button class="btn btn-gold">Aceitar proposta</button>
    <p class="ajuda">Ao aceitar, você confirma sua concordância comercial com o escopo, os valores e as condições desta proposta. A formalização será realizada posteriormente por meio de contrato assinado.</p>
    <p class="ajuda">Guardamos seu nome, a data e o endereço de internet deste aparelho como registro do aceite. Prefere conversar antes? <a href="links">Fale com a Rovya</a>.</p></form>`;
}

function mostrar(p) {
  const nome = p.cliente.empresa || p.cliente.nome, itens = p.itens || [];
  document.title = `${p.titulo} | ROVYA Creative`;
  $('main').innerHTML = `<section class="painel">
      <div class="eyebrow">Proposta comercial · versão ${esc(p.versao)}</div>
      <h1>${esc(p.titulo)}</h1>
      <p class="mute">Para <b>${esc(nome)}</b>${p.enviada_em ? ' · enviada em ' + data(p.enviada_em) : ''}${p.validade ? ' · válida até ' + data(p.validade) : ''}</p>
    </section>
    ${itens.length ? `<section class="painel"><h2>Investimento</h2><table><thead><tr><th>Serviço</th><th class="dir">Qtd</th><th class="dir">Valor</th></tr></thead>
      <tbody>${itens.map(it => `<tr><td>${esc(it.nome)}${it.descricao ? `<small>${esc(it.descricao)}</small>` : ''}</td><td class="dir">${esc(it.qtd)}</td><td class="dir">${brl((Number(it.qtd) || 0) * (Number(it.preco) || 0))}</td></tr>`).join('')}</tbody>
      <tfoot>${Number(p.desconto) ? `<tr><td colspan="2" class="dir mute">Desconto</td><td class="dir">− ${brl(p.desconto)}</td></tr>` : ''}
        <tr><td colspan="2" class="dir">Total</td><td class="dir total">${brl(p.valor)}</td></tr></tfoot></table></section>` : ''}
    ${p.corpo ? `<section class="painel"><div class="txt">${md(p.corpo)}</div></section>` : ''}
    <section class="painel" id="aceite"><h2>Aceite</h2>${situacao(p)}</section>`;
  $('pdf').hidden = false;
  const f = $('fAceite'); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault(); const b = f.querySelector('button'); b.disabled = true; $('mAceite').textContent = '';
    try { const r = await chamar({ acao: 'aceitar', nome: f.nome.value }); Object.assign(p, { aceite_em: r.aceite_em, aceite_nome: r.aceite_nome, status: 'aprovada' }); mostrar(p); $('aceite').scrollIntoView({ behavior: 'smooth' }); }
    catch (err) { $('mAceite').textContent = err.message; b.disabled = false; }
  };
}

$('pdf').onclick = () => print();
$('tema').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; try { localStorage.setItem('rovya-tema', t); } catch (e) { } };
if (!/^[0-9a-f]{32}$/.test(token)) $('main').innerHTML = aviso('Link incompleto. Abra de novo o link que a Rovya mandou.');
else chamar({ acao: 'ver' }).then(mostrar, e => { $('main').innerHTML = aviso(esc(e.message)); });
</script>
</body>
</html>
